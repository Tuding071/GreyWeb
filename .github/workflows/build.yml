                              }
                          }
                          codes.add(buildCode(o, sb.toString(), tok))
                      }
                      main.post {
                          if (t.session === wv && t.token == tok) {
                              for (c in codes) wv.evaluateJavascript(c, null)
                          }
                      }
                  }.start()
              }

              private fun hideCode(sels: List<String>): String {
                  val css = StringBuilder()
                  for (s in sels) css.append(s).append("{display:none!important}\n")
                  return "(function(){var a=function(){var s=document.createElement('style');" +
                      "s.setAttribute('data-grey-hide','1');s.textContent=" + JSONObject.quote(css.toString()) +
                      ";(document.head||document.documentElement).appendChild(s);};" +
                      "if(document.documentElement){a();}else{document.addEventListener('DOMContentLoaded',a,{once:true});}})();"
              }

              private fun buildCode(s: JSONObject, libs: String, tok: String): String {
                  val sc = JSONObject()
                  sc.put("name", s.optString("name"))
                  sc.put("version", s.optString("version"))
                  sc.put("description", s.optString("description"))
                  sc.put("namespace", s.optString("namespace"))
                  sc.put("grant", s.optJSONArray("grants") ?: JSONArray())
                  sc.put("matches", s.optJSONArray("matches") ?: JSONArray())
                  val info = JSONObject()
                  info.put("script", sc)
                  info.put("scriptHandler", "GreyWeb")
                  info.put("version", "1.0")
                  var runAt = s.optString("runAt")
                  if (runAt.isBlank()) runAt = "document-idle"
                  val timing = when (runAt) {
                      "document-start" -> "__safe();"
                      "document-end" -> "if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', __safe, { once: true }); } else { __safe(); }"
                      else -> "if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', function () { setTimeout(__safe, 0); }, { once: true }); } else { __safe(); }"
                  }
                  val vals = (s.opt("values") ?: JSONObject()).toString()
                  val sb = StringBuilder()
                  sb.append("(function () {\n")
                  sb.append("var __A = (").append(gmJs).append(")(")
                      .append(JSONObject.quote(s.optString("id"))).append(", ")
                      .append(vals).append(", ")
                      .append(info.toString()).append(", ")
                      .append(JSONObject.quote(tok)).append(");\n")
                  sb.append("var GM_info = __A.GM_info, GM_log = __A.GM_log, GM_addStyle = __A.GM_addStyle, GM_getValue = __A.GM_getValue, GM_setValue = __A.GM_setValue, GM_deleteValue = __A.GM_deleteValue, GM_listValues = __A.GM_listValues, GM_xmlhttpRequest = __A.GM_xmlhttpRequest, GM_setClipboard = __A.GM_setClipboard, GM_openInTab = __A.GM_openInTab, GM_registerMenuCommand = __A.GM_registerMenuCommand, GM_notification = __A.GM_notification, GM_download = __A.GM_download, GM = __A.GM, unsafeWindow = __A.unsafeWindow;\n")
                  sb.append("var __run = function () {\n")
                  if (libs.isNotEmpty()) sb.append(libs).append("\n;\n")
                  sb.append(s.optString("code")).append("\n};\n")
                  sb.append("var __safe = function () { try { __run(); } catch (e) { GM_log('script error: ' + (e && e.stack ? e.stack : e)); } };\n")
                  sb.append(timing).append("\n})();")
                  return sb.toString()
              }

              private fun fetchLib(url: String): String {
                  val c0 = libCache[url]
                  if (c0 != null) return c0
                  var out = ""
                  try {
                      val c = URL(url).openConnection() as HttpURLConnection
                      try {
                          c.connectTimeout = 15000
                          c.readTimeout = 20000
                          c.instanceFollowRedirects = true
                          c.setRequestProperty("User-Agent", ua)
                          if (c.responseCode in 200..299) {
                              out = c.inputStream.bufferedReader().use { it.readText() }
                          }
                      } finally {
                          c.disconnect()
                      }
                  } catch (e: Exception) {
                      Log.e("GreyScript", "lib fetch failed " + url, e)
                  }
                  if (out.isNotEmpty()) libCache[url] = out
                  return out
              }

              private fun doXhr(d: JSONObject?, rid: Int, reply: JavaScriptReplyProxy) {
                  if (d == null) return
                  Thread {
                      val out = JSONObject()
                      try {
                          val url = d.optString("url")
                          if (!HTTP_RE.containsMatchIn(url)) throw Exception("bad url")
                          var method = d.optString("method", "GET").uppercase()
                          if (method.isBlank()) method = "GET"
                          val c = URL(url).openConnection() as HttpURLConnection
                          try {
                              val tmo = d.optInt("timeout", 0)
                              c.connectTimeout = if (tmo > 0) tmo else 30000
                              c.readTimeout = if (tmo > 0) tmo else 60000
                              c.instanceFollowRedirects = true
                              c.requestMethod = method
                              var hasUa = false
                              var hasCookie = false
                              val ho = d.optJSONObject("headers")
                              if (ho != null) {
                                  for (k in ho.keys()) {
                                      if (k.equals("user-agent", true)) hasUa = true
                                      if (k.equals("cookie", true)) hasCookie = true
                                      c.setRequestProperty(k, ho.optString(k))
                                  }
                              }
                              if (!hasUa) c.setRequestProperty("User-Agent", ua)
                              if (!hasCookie) {
                                  val ck = try { CookieManager.getInstance().getCookie(url) } catch (e: Exception) { null }
                                  if (!ck.isNullOrBlank()) c.setRequestProperty("Cookie", ck)
                              }
                              if (!d.isNull("data") && d.has("data") && method != "GET" && method != "HEAD") {
                                  c.doOutput = true
                                  c.outputStream.use { it.write(d.optString("data").toByteArray(Charsets.UTF_8)) }
                              }
                              val code = c.responseCode
                              val stream = if (code >= 400) c.errorStream else c.inputStream
                              val bytes = stream?.use { it.readBytes() } ?: ByteArray(0)
                              val hs = StringBuilder()
                              for ((k, v) in c.headerFields) {
                                  if (k == null) continue
                                  for (x in v) hs.append(k).append(": ").append(x).append("\r\n")
                                  if (k.equals("set-cookie", true)) {
                                      for (x in v) {
                                          try { CookieManager.getInstance().setCookie(url, x) } catch (e: Exception) {}
                                      }
                                  }
                              }
                              out.put("ok", true)
                              out.put("status", code)
                              out.put("statusText", c.responseMessage ?: "")
                              out.put("finalUrl", c.url.toString())
                              out.put("responseHeaders", hs.toString())
                              out.put("b64", Base64.encodeToString(bytes, Base64.NO_WRAP))
                          } finally {
                              c.disconnect()
                          }
                      } catch (e: java.net.SocketTimeoutException) {
                          out.put("ok", false)
                          out.put("timeout", true)
                          out.put("error", "timeout")
                      } catch (e: Exception) {
                          out.put("ok", false)
                          out.put("error", e.toString())
                      }
                      val resp = JSONObject()
                      resp.put("__rid", rid)
                      resp.put("__v", out)
                      val text = resp.toString()
                      main.post {
                          try {
                              reply.postMessage(text)
                          } catch (e: Exception) {
                              Log.e("GreyScript", "xhr reply failed", e)
                          }
                      }
                  }.start()
              }

              // ---------------- request interception ----------------

              fun intercept(t: BrowserTab, req: WebResourceRequest): WebResourceResponse? {
                  val url = req.url.toString()
                  if (url.length < 8 || url[0] != 'h') return null
                  val top = req.isForMainFrame
                  val hdr: Map<String, String> = req.requestHeaders ?: emptyMap()
                  if (!top) {
                      val type = guessType(req, hdr)
                      if (AdBlock.shouldBlock(url, t.pageUrl, type)) {
                          countBlocked()
                          return blockedResp(type)
                      }
                  }
                  try {
                      sniff(t, url, hdr)
                  } catch (e: Throwable) {
                  }
                  if (!top && Videos.enabled && DlPrefs.grabOnly && isMediaPayload(t, url, hdr)) {
                      return blockedResp("media")
                  }
                  return null
              }

              // "Grab only": video/audio payloads are refused, playlists and normal web assets still load.
              private fun isMediaPayload(t: BrowserTab, url: String, hdr: Map<String, String>): Boolean {
                  if (MPD.containsMatchIn(url) || M3U8.containsMatchIn(url)) return false
                  if (VIDEO_EXT.containsMatchIn(url) || AUDIO_EXT.containsMatchIn(url) || SEG_EXT.containsMatchIn(url)) return true
                  for (k in hdr.keys) if (k.equals("range", true)) return true
                  if (!WEB_ASSET.containsMatchIn(url)) {
                      val base = url.substringBefore('?')
                      for (d in t.mediaDirs) if (base.startsWith(d)) return true
                  }
                  return false
              }

              private fun blockedResp(type: String): WebResourceResponse {
                  val mime = if (type == "subdocument") "text/html" else "text/plain"
                  return WebResourceResponse(mime, "utf-8", 404, "Blocked", HashMap<String, String>(), ByteArrayInputStream(ByteArray(0)))
              }

              private fun countBlocked() {
                  blockedN.incrementAndGet()
                  synchronized(this) {
                      if (statPosted) return
                      statPosted = true
                  }
                  main.postDelayed({
                      synchronized(this) { statPosted = false }
                      Filters.blocked = blockedN.get()
                  }, 1500L)
              }

              private fun guessType(req: WebResourceRequest, hdr: Map<String, String>): String {
                  var dest = ""
                  var acc = ""
                  var hasRange = false
                  for ((k, v) in hdr) {
                      val kl = k.lowercase()
                      if (kl == "sec-fetch-dest") dest = v.lowercase()
                      else if (kl == "accept") acc = v.lowercase()
                      else if (kl == "range") hasRange = true
                  }
                  when (dest) {
                      "script", "worker", "sharedworker", "serviceworker" -> return "script"
                      "image" -> return "image"
                      "style" -> return "stylesheet"
                      "iframe", "frame" -> return "subdocument"
                      "font" -> return "font"
                      "audio", "video", "track" -> return "media"
                      "object", "embed" -> return "object"
                  }
                  val p = (req.url.path ?: "").lowercase()
                  if (acc.startsWith("text/html")) return "subdocument"
                  if (acc.contains("image/")) return "image"
                  if (acc.contains("text/css")) return "stylesheet"
                  if (p.endsWith(".js") || p.endsWith(".mjs")) return "script"
                  if (p.endsWith(".css")) return "stylesheet"
                  if (p.endsWith(".woff") || p.endsWith(".woff2") || p.endsWith(".ttf") || p.endsWith(".otf")) return "font"
                  if (hasRange || VIDEO_EXT.containsMatchIn(p) || AUDIO_EXT.containsMatchIn(p)) return "media"
                  return "other"
              }

              private fun classify(url: String, ct0: String): String {
                  val c = ct0.lowercase()
                  if (MPD.containsMatchIn(url) || c.contains("dash+xml")) return "dash"
                  if (M3U8.containsMatchIn(url) || c.contains("mpegurl")) return "hls"
                  if (SKIP_EXT.containsMatchIn(url)) return ""
                  if (c.contains("mp2t") || c.contains("segment")) return ""
                  if (AUDIO_EXT.containsMatchIn(url) || c.startsWith("audio/")) return "audio"
                  if (VIDEO_EXT.containsMatchIn(url) || c.startsWith("video/")) return "file"
                  return ""
              }

              private fun sniff(t: BrowserTab, url: String, hdr: Map<String, String>) {
                  if (!Videos.enabled) return
                  var hasRange = false
                  for (k in hdr.keys) if (k.equals("range", true)) hasRange = true
                  val isManifest = MPD.containsMatchIn(url) || M3U8.containsMatchIn(url)
                  val maybeFile = !SKIP_EXT.containsMatchIn(url) &&
                      (VIDEO_EXT.containsMatchIn(url) || AUDIO_EXT.containsMatchIn(url))
                  if (!isManifest && !maybeFile && !hasRange) return
                  val key = t.id.toString() + "|" + url.substringBefore('#')
                  if (probed.putIfAbsent(key, true) != null) return
                  if (probed.size > 3000) probed.clear()
                  val h = HashMap<String, String>()
                  for ((k, v) in hdr) {
                      when (k.lowercase()) {
                          "referer" -> h["Referer"] = v
                          "user-agent" -> h["User-Agent"] = v
                          "origin" -> h["Origin"] = v
                      }
                  }
                  val ck = try { CookieManager.getInstance().getCookie(url) } catch (e: Exception) { null }
                  if (!ck.isNullOrBlank()) h["Cookie"] = ck
                  if (!h.containsKey("User-Agent")) h["User-Agent"] = ua
                  if (!h.containsKey("Referer") && t.pageUrl.startsWith("http")) h["Referer"] = t.pageUrl
                  if (!h.containsKey("Origin")) {
                      val og = originOfUrl(h["Referer"] ?: "")
                      if (og != null) h["Origin"] = og
                  }
                  if (isManifest) {
                      try {
                          val dir = url.substringBefore('?').substringBeforeLast('/') + "/"
                          if (dir.count { it == '/' } >= 4) t.mediaDirs.add(dir)
                      } catch (e: Exception) {
                      }
                      val kind = classify(url, "")
                      main.post { Videos.onDetected(t.id, url, "", -1L, h, kind) }
                      return
                  }
                  probe(t, url, h)
              }

              private fun probe(t: BrowserTab, url: String, h: Map<String, String>) {
                  probePool.execute {
                      var ct = ""
                      var len = -1L
                      try {
                          val c = URL(url).openConnection() as HttpURLConnection
                          try {
                              c.connectTimeout = 8000
                              c.readTimeout = 8000
                              c.instanceFollowRedirects = true
                              for ((k, v) in h) c.setRequestProperty(k, v)
                              c.setRequestProperty("Range", "bytes=0-0")
                              ct = c.contentType ?: ""
                              val cr = c.getHeaderField("Content-Range")
                              if (cr != null) {
                                  val m = Regex("/(\\d+)\\s*\$").find(cr)
                                  if (m != null) len = m.groupValues[1].toLong()
                              } else {
                                  len = c.contentLengthLong
                              }
                          } finally {
                              c.disconnect()
                          }
                      } catch (e: Exception) {
                          return@execute
                      }
                      val kind = classify(url, ct)
                      if (kind.isEmpty()) return@execute
                      if (kind == "file" || kind == "audio") {
                          if (SEG_NAME.containsMatchIn(url)) return@execute
                          val minLen = if (kind == "audio") 102400L else 204800L
                          if (len >= 0 && len < minLen) return@execute
                      }
                      main.post { Videos.onDetected(t.id, url, ct, len, h, kind) }
                  }
              }
          }

          object AdBlock {
              class Rule(
                  val p: String,
                  val rx: Boolean,
                  val tp: Int,
                  val types: Set<String>?,
                  val ntypes: Set<String>?,
                  val dinc: List<String>?,
                  val dexc: List<String>?,
                  val imp: Boolean
              ) {
                  @Volatile var re: Regex? = null
                  @Volatile var tried = false
              }

              class Index {
                  val block = HashMap<String, ArrayList<Rule>>()
                  val blockGen = ArrayList<Rule>()
                  val allow = HashMap<String, ArrayList<Rule>>()
                  val allowGen = ArrayList<Rule>()
                  var n = 0
              }

              @Volatile private var idx: Index? = null
              @Volatile private var loadedVer = -1
              @Volatile private var loading = false

              private val TYPES = mapOf(
                  "script" to "script", "image" to "image", "imageset" to "image", "stylesheet" to "stylesheet",
                  "css" to "stylesheet", "xmlhttprequest" to "xmlhttprequest", "xhr" to "xmlhttprequest",
                  "sub_frame" to "subdocument", "subdocument" to "subdocument", "frame" to "subdocument",
                  "media" to "media", "font" to "font", "object" to "object", "object_subrequest" to "object",
                  "object-subrequest" to "object", "ping" to "ping", "beacon" to "ping", "websocket" to "websocket",
                  "other" to "other"
              )
              private val TOK = Regex("[a-z0-9]{3,}")
              private val OPTRE = Regex("^[a-z0-9_~,=|.*:-]+\$", RegexOption.IGNORE_CASE)
              private val HOSTS = Regex("^(?:0\\.0\\.0\\.0|127\\.0\\.0\\.1)\\s+([^\\s#]+)")
              private val COSM = Regex("^[a-z0-9.,~*_-]*#[@?\$%]*#", RegexOption.IGNORE_CASE)
              private const val SPECIAL = ".*+?^\${}()|[]\\/"

              fun ensure() {
                  if (!Filters.isOn()) {
                      idx = null
                      loadedVer = Filters.ver
                      return
                  }
                  if (idx != null && loadedVer == Filters.ver) return
                  if (loading) return
                  loading = true
                  val ver = Filters.ver
                  Thread {
                      try {
                          val x = parse(Filters.combined())
                          idx = x
                          loadedVer = ver
                          try { Filters.dropCache() } catch (e: Throwable) {}
                          Web.postMain { Filters.loadedNet = x.n }
                          Log.d("GreyScript", "ad rules loaded " + x.n)
                      } catch (e: Throwable) {
                          Log.e("GreyScript", "ad load failed", e)
                      } finally {
                          loading = false
                      }
                  }.start()
              }

              private fun token(p0: String): String {
                  val p = p0.lowercase()
                  var best = ""
                  for (m in TOK.findAll(p)) {
                      val s = m.range.first
                      val e = m.range.last + 1
                      if (s == 0 || e >= p.length) continue
                      if (p[s - 1] == '*' || p[e] == '*') continue
                      if (m.value.length > best.length) best = m.value
                  }
                  return best
              }

              private fun addNet(x: Index, line0: String) {
                  var line = line0
                  var exc = false
                  if (line.startsWith("@@")) {
                      exc = true
                      line = line.substring(2)
                  }
                  var pat = line
                  var opts = ""
                  val di = line.lastIndexOf('$')
                  if (di >= 0) {
                      val cand = line.substring(di + 1)
                      if (OPTRE.matches(cand) && !(line.startsWith("/") && line.endsWith("/"))) {
                          pat = line.substring(0, di)
                          opts = cand
                      }
                  }
                  if (pat.isEmpty()) return
                  var tp = 0
                  var types: HashSet<String>? = null
                  var ntypes: HashSet<String>? = null
                  var dinc: ArrayList<String>? = null
                  var dexc: ArrayList<String>? = null
                  var imp = false
                  if (opts.isNotEmpty()) {
                      for (o0 in opts.split(",")) {
                          var o = o0
                          if (o.isEmpty()) continue
                          var v = ""
                          var neg = false
                          val eq = o.indexOf('=')
                          if (eq > 0) {
                              v = o.substring(eq + 1)
                              o = o.substring(0, eq)
                          }
                          if (o.startsWith("~")) {
                              neg = true
                              o = o.substring(1)
                          }
                          o = o.lowercase()
                          val ty = TYPES[o]
                          if (o == "third-party" || o == "3p") {
                              tp = if (neg) -1 else 1
                          } else if (o == "first-party" || o == "1p") {
                              tp = if (neg) 1 else -1
                          } else if (ty != null) {
                              if (neg) {
                                  if (ntypes == null) ntypes = HashSet()
                                  ntypes.add(ty)
                              } else {
                                  if (types == null) types = HashSet()
                                  types.add(ty)
                              }
                          } else if (o == "domain") {
                              for (d0 in v.split("|")) {
                                  val d = d0.lowercase()
                                  if (d.isEmpty()) continue
                                  if (d.startsWith("~")) {
                                      if (dexc == null) dexc = ArrayList()
                                      dexc.add(d.substring(1))
                                  } else {
                                      if (dinc == null) dinc = ArrayList()
                                      dinc.add(d)
                                  }
                              }
                          } else if (o == "important") {
                              imp = true
                          } else if (o == "match-case" || o == "all") {
                              // ignored
                          } else {
                              return
                          }
                      }
                  }
                  val rx = pat.length > 2 && pat.startsWith("/") && pat.endsWith("/")
                  val r = Rule(pat, rx, tp, types, ntypes, dinc, dexc, imp)
                  val tok = if (rx) "" else token(pat)
                  val bucket = if (exc) x.allow else x.block
                  val gen = if (exc) x.allowGen else x.blockGen
                  if (tok.isNotEmpty()) {
                      var l = bucket[tok]
                      if (l == null) {
                          l = ArrayList()
                          bucket[tok] = l
                      }
                      l.add(r)
                  } else {
                      gen.add(r)
                  }
                  x.n++
              }

              private fun parse(text: String): Index {
                  val x = Index()
                  for (raw in text.lineSequence()) {
                      val line = raw.trim()
                      if (line.isEmpty()) continue
                      val c0 = line[0]
                      if (c0 == '!' || c0 == '[') continue
                      if (c0 == '#' && (line.length == 1 || (line[1] != '#' && line[1] != '@'))) continue
                      val hm = HOSTS.find(line)
                      if (hm != null) {
                          val h = hm.groupValues[1]
                          if (h != "localhost" && h.indexOf('.') > 0) addNet(x, "||" + h + "^")
                          continue
                      }
                      if (COSM.containsMatchIn(line)) continue
                      addNet(x, line)
                  }
                  return x
              }

              private fun regexOf(r: Rule): Regex? {
                  val p = r.p
                  try {
                      if (r.rx) return Regex(p.substring(1, p.length - 1), RegexOption.IGNORE_CASE)
                      val sb = StringBuilder()
                      var i = 0
                      if (p.startsWith("||")) {
                          sb.append("^[a-z][a-z0-9+.-]*:\\/\\/(?:[^\\/?#]*\\.)?")
                          i = 2
                      } else if (p.startsWith("|")) {
                          sb.append("^")
                          i = 1
                      }
                      var end = p.length
                      var tail = ""
                      if (end > i && p[end - 1] == '|') {
                          tail = "\$"
                          end--
                      }
                      while (i < end) {
                          val c = p[i]
                          if (c == '*') {
                              sb.append(".*")
                          } else if (c == '^') {
                              sb.append("(?:[^a-zA-Z0-9_.%-]|\$)")
                          } else {
                              if (SPECIAL.indexOf(c) >= 0) sb.append('\\')
                              sb.append(c)
                          }
                          i++
                      }
                      sb.append(tail)
                      return Regex(sb.toString(), RegexOption.IGNORE_CASE)
                  } catch (e: Exception) {
                      return null
                  }
              }

              private fun hostIn(h: String, list: List<String>): Boolean {
                  for (d in list) {
                      if (h == d) return true
                      if (h.length > d.length && h.endsWith("." + d)) return true
                  }
                  return false
              }

              private fun base(h: String): String {
                  val p = h.split(".")
                  val n = p.size
                  if (n <= 2) return h
                  val l2 = p[n - 2]
                  if (p[n - 1].length == 2 && (l2 == "co" || l2 == "com" || l2 == "org" || l2 == "net" ||
                          l2 == "gov" || l2 == "edu" || l2 == "ac" || l2 == "ne" || l2 == "or")
                  ) {
                      return p.subList(n - 3, n).joinToString(".")
                  }
                  return p.subList(n - 2, n).joinToString(".")
              }

              private fun hostOf2(u: String): String = try {
                  (Uri.parse(u).host ?: "").lowercase()
              } catch (e: Exception) {
                  ""
              }

              private fun test(r: Rule, url: String, third: Boolean, type: String, host: String): Boolean {
                  if (r.tp == 1 && !third) return false
                  if (r.tp == -1 && third) return false
                  val ty = r.types
                  if (ty != null && !ty.contains(type)) return false
                  val nt = r.ntypes
                  if (nt != null && nt.contains(type)) return false
                  val de = r.dexc
                  if (de != null && hostIn(host, de)) return false
                  val di = r.dinc
                  if (di != null && !hostIn(host, di)) return false
                  var re = r.re
                  if (re == null) {
                      if (r.tried) return false
                      re = regexOf(r)
                      r.re = re
                      r.tried = true
                      if (re == null) return false
                  }
                  return re.containsMatchIn(url)
              }

              private fun match(
                  map: HashMap<String, ArrayList<Rule>>, gen: ArrayList<Rule>,
                  url: String, third: Boolean, type: String, host: String
              ): Rule? {
                  val seen = HashSet<String>()
                  for (m in TOK.findAll(url.lowercase())) {
                      val t = m.value
                      if (!seen.add(t)) continue
                      val b = map[t]
                      if (b != null) {
                          for (r in b) if (test(r, url, third, type, host)) return r
                      }
                  }
                  for (r in gen) if (test(r, url, third, type, host)) return r
                  return null
              }

