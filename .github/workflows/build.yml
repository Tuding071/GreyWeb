                          val f = thumbFile(id)
                          if (f.exists()) {
                              val bmp = BitmapFactory.decodeFile(f.path)
                              if (bmp != null) t.thumb = bmp.asImageBitmap()
                          }
                          if (id > maxId) maxId = id
                          tabs.add(t)
                      }
                      counter = maxId
                      val curId = root.optInt("cur", 0)
                      val c = tabs.firstOrNull { it.id == curId } ?: tabs.last()
                      current = c
                      c.lastUsed = System.currentTimeMillis()
                      val seenKeys = HashSet<String>()
                      for (x in listOf(c) + tabs.filter { it !== c }) {
                          if (x.url.isBlank() || x.url.startsWith("about:")) continue
                          if (!seenKeys.add(normUrl(x.url))) removeTab(x, false)
                      }
                      return true
                  } catch (e: Exception) {
                      Log.d("GreyScript", "restore failed: " + e)
                      tabs.clear()
                      current = null
                      return false
                  }
              }

              // Same site as the reference tab: right below it. Other site: end of that site's group, or the end of the list.
              private fun insertIndexFor(url: String, ref: BrowserTab? = current): Int {
                  val key = keyOfUrl(url)
                  if (ref != null && !ref.preview) {
                      val ci = tabs.indexOf(ref)
                      if (ci >= 0 && groupKeyOf(ref) == key) return ci + 1
                  }
                  var last = -1
                  for (i in tabs.indices) {
                      val x = tabs[i]
                      if (!x.preview && groupKeyOf(x) == key) last = i
                  }
                  return if (last >= 0) last + 1 else tabs.size
              }

              fun newTab(url: String, makeCurrent: Boolean = true, openerId: Int = 0): BrowserTab {
                  var opener = openerId
                  if (url.isNotBlank() && !url.startsWith("about:")) {
                      val key = normUrl(url)
                      val dups = tabs.filter { !it.preview && it.url.isNotBlank() && normUrl(it.url) == key }
                      val cd = dups.firstOrNull { it === current }
                      if (!makeCurrent && cd != null) return cd
                      for (d in dups) {
                          if (d.id == opener) opener = d.openerId
                          if (d === current) current = null
                          removeTab(d, false)
                      }
                  }
                  if (makeCurrent) home = false
                  counter += 1
                  val t = BrowserTab(counter, null, opener)
                  t.url = url
                  tabs.add(insertIndexFor(url).coerceIn(0, tabs.size), t)
                  ensureLive(t, url)
                  if (makeCurrent || current == null) select(t)
                  enforceLimit()
                  persist()
                  return t
              }

              private fun dedupe(t: BrowserTab) {
              if (t.preview) return
                  if (t.url.isBlank() || t.url.startsWith("about:")) return
                  if (!tabs.contains(t)) return
                  val key = normUrl(t.url)
                  val dups = tabs.filter { it !== t && !it.preview && it.url.isNotBlank() && normUrl(it.url) == key }
                  if (dups.isEmpty()) return
                  if (t !== current && dups.any { it === current }) {
                      removeTab(t, false)
                      return
                  }
                  for (d in dups) {
                      if (t.openerId == d.id) t.openerId = d.openerId
                      removeTab(d, false)
                  }
              }

              private fun ensureLive(t: BrowserTab, initialUrl: String? = null) {
                  if (t.session != null) return
                  val wv = WebView(Web.act ?: Web.appCtx)
                  t.session = wv
                  t.failed = false
                  Web.setup(t, wv)
                  attach(t, wv)
                  val st = t.savedState
                  if (initialUrl != null) {
                      wv.loadUrl(initialUrl)
                  } else if (st != null && wv.restoreState(st) != null) {
                      // restored from saved state
                  } else if (t.url.isNotBlank() && t.url != "about:blank") {
                      wv.loadUrl(t.url)
                  }
              }

              fun showJs(r: JsReq) {
                  val old = js
                  if (old != null) {
                      try {
                          old.cancel()
                      } catch (e: Exception) {
                      }
                  }
                  js = r
              }

              fun exitFullscreen() {
                  val ft = tabs.firstOrNull { it.id == fullscreenTab }
                  try {
                      customCb?.onCustomViewHidden()
                      customView = null
                      customCb = null
                  } catch (e: Exception) {
                  }
                  fullscreen = false
                  fullscreenTab = 0
              }

              fun reloadTab(t: BrowserTab) {
                  val eu = t.errorUrl
                  if (eu != null) t.session?.loadUrl(eu) else t.session?.reload()
              }

              fun select(t: BrowserTab) {
                  if (fullscreen && fullscreenTab != t.id) exitFullscreen()
                  val prev = current
                  Log.d("GreyScript", "select tab " + t.id + " " + t.url + " session=" + System.identityHashCode(t.session))
                  if (prev != null && prev !== t) prev.lastUsed = System.currentTimeMillis()
                  ensureLive(t)
                  t.lastUsed = System.currentTimeMillis()
                  current = t
                  if (prev != null && prev !== t && prev.preview) removeTab(prev, false)
                  enforceLimit()
                  persist()
              }

              fun load(t: BrowserTab, url: String) {
              home = false
              ensureLive(t)
                  t.session?.loadUrl(url)
              }

              fun openerOf(t: BrowserTab): BrowserTab? =
                  if (t.openerId == 0) null else tabs.firstOrNull { it.id == t.openerId }

              fun closeToOpener(t: BrowserTab) {
                  val op = openerOf(t)
                  if (op != null) select(op)
                  close(t)
              }

              fun close(t: BrowserTab) {
                  removeTab(t, true)
              }

              private fun removeTab(t: BrowserTab, keepOne: Boolean) {
                  val i = tabs.indexOf(t)
                  if (i < 0) return
                  tabs.removeAt(i)
                  val s = t.session
                  t.session = null
                  try {
                      thumbFile(t.id).delete()
                  } catch (e: Exception) {
                  }
                  if (tabs.isEmpty()) {
                      current = null
                      if (keepOne) home = true
                  } else if (current === t) {
                      select(tabs[minOf(i, tabs.size - 1)])
                  }
                  if (s != null) main.postDelayed({ Web.destroy(s) }, 400)
                  persist()
              }

              fun closeAll() {
                  closing = true
                  main.removeCallbacks(saveRunnable)
                  main.removeCallbacks(idleTick)
                  for (t in tabs.toList()) {
                      t.session?.let { Web.destroy(it) }
                      t.session = null
                  }
                  tabs.clear()
                  current = null
              }

              fun requestClose(t: BrowserTab) {
                  if (closingIds.contains(t.id)) return
                  closingIds.add(t.id)
                  val r = Runnable {
                      closeJobs.remove(t.id)
                      closingIds.remove(t.id)
                      close(t)
                  }
                  closeJobs[t.id] = r
                  main.postDelayed(r, 2000L)
              }

              fun undoClose(t: BrowserTab) {
                  val r = closeJobs.remove(t.id)
                  if (r != null) main.removeCallbacks(r)
                  closingIds.remove(t.id)
              }

              private fun recover(t: BrowserTab, dead: WebView) {
                  if (t.session !== dead) return
                  Log.d("GreyScript", "session died for tab " + t.id + " " + t.url)
                  if (fullscreenTab == t.id) {
                      fullscreen = false
                      fullscreenTab = 0
                  }
                  t.session = null
                  t.loading = false
                  t.progress = 0
                  main.post { Web.destroy(dead) }
                  val now = System.currentTimeMillis()
                  if (now - t.lastRecover < 5000L) t.savedState = null
                  t.lastRecover = now
                  if (t === current && !home && t.url.isNotBlank() && t.url != "about:blank") ensureLive(t)
              }

              fun refreshView() {
              }

              fun openPreview(url: String, openerId: Int): BrowserTab {
                  var op = openerId
                  val c = current
                  if (c != null && c.preview) op = c.openerId
                  counter += 1
                  val t = BrowserTab(counter, null, op)
                  t.preview = true
                  t.url = url
                  tabs.add(t)
                  ensureLive(t, url)
                  home = false
                  select(t)
                  return t
              }

              fun keep(t: BrowserTab) {
                  t.preview = false
                  dedupe(t)
                  val ref = openerOf(t) ?: current
                  val i = tabs.indexOf(t)
                  if (i >= 0) {
                      tabs.removeAt(i)
                      tabs.add(insertIndexFor(t.url, if (ref === t) null else ref).coerceIn(0, tabs.size), t)
                  }
                  persist()
              }

              fun closePreviewTab(t: BrowserTab) {
                  if (openerOf(t) != null) closeToOpener(t) else close(t)
              }

              fun cycleMaxBg() {
                  val opts = listOf(2, 4, 6, 8, 10)
                  val i = opts.indexOf(maxBg)
                  maxBg = opts[(i + 1) % opts.size]
                  Web.appCtx.getSharedPreferences("browser", Context.MODE_PRIVATE)
                      .edit().putInt("maxbg", maxBg).apply()
                  enforceLimit()
              }

              private fun discard(t: BrowserTab) {
                  if (t === current) return
                  val s = t.session ?: return
                  try {
                      val b = Bundle()
                      s.saveState(b)
                      t.savedState = b
                  } catch (e: Exception) {
                  }
                  t.session = null
                  t.loading = false
                  t.progress = 0
                  main.postDelayed({ Web.destroy(s) }, 150)
              }

              private fun enforceLimit() {
                  val cur = current
                  val bg = tabs.filter { it !== cur && it.session != null }.sortedBy { it.lastUsed }
                  var extra = bg.size - maxBg
                  for (b in bg) {
                      if (extra <= 0) break
                      if (!b.loading) {
                          discard(b)
                          extra--
                      }
                  }
              }

              private fun discardIdle() {
                  val now = System.currentTimeMillis()
                  for (t in tabs.toList()) {
                      if (t !== current && t.session != null && !t.loading && now - t.lastUsed > 1200000L) {
                          discard(t)
                      }
                  }
              }

              fun trim(level: Int) {
                  val keep = if (level >= 40) 1 else if (level >= 15) 2 else return
                  val cur = current
                  val bg = tabs.filter { it !== cur && it.session != null }.sortedByDescending { it.lastUsed }
                  for (i in bg.indices) {
                      if (i >= keep) discard(bg[i])
                  }
              }

              @Volatile var browserVisible = true

              fun capture(t: BrowserTab, attempt: Int = 0, onDone: (() -> Unit)? = null) {
                  val wv = t.session
                  val act = Web.act
                  if (wv == null || act == null || home || current !== t || !browserVisible || Motion.browserIn.value < 1f) {
                      onDone?.invoke()
                      return
                  }
                  if (wv.width <= 0 || wv.height <= 0 || wv.parent == null || !wv.isShown) {
                      if (onDone == null && attempt < 3) main.postDelayed({ capture(t, attempt + 1) }, 1000)
                      onDone?.invoke()
                      return
                  }
                  try {
                      val side = minOf(wv.width, wv.height)
                      val loc = IntArray(2)
                      wv.getLocationInWindow(loc)
                      val rect = android.graphics.Rect(loc[0], loc[1], loc[0] + side, loc[1] + side)
                      val bmp = Bitmap.createBitmap(side, side, Bitmap.Config.ARGB_8888)
                      android.view.PixelCopy.request(act.window, rect, bmp, { res ->
                          val still = browserVisible && !home && current === t && t.session === wv && Motion.browserIn.value >= 1f
                          if (res != android.view.PixelCopy.SUCCESS || !still) {
                              if (onDone == null && attempt < 3) main.postDelayed({ capture(t, attempt + 1) }, 1000)
                          } else if (blankBmp(bmp)) {
                              if (onDone == null && attempt < 3) {
                                  main.postDelayed({ capture(t, attempt + 1) }, 1200)
                              } else if (onDone == null) {
                                  saveThumb(t, bmp)
                              }
                          } else {
                              saveThumb(t, bmp)
                          }
                          onDone?.invoke()
                      }, main)
                  } catch (e: Exception) {
                      Log.d("GreyScript", "capture threw: " + e)
                      onDone?.invoke()
                  }
              }

              private fun blankBmp(b: Bitmap): Boolean {
                  val first = b.getPixel(b.width / 2, b.height / 2)
                  for (i in 1..7) {
                      for (j in 1..7) {
                          if (b.getPixel(b.width * i / 8, b.height * j / 8) != first) return false
                      }
                  }
                  return true
              }

              private fun saveThumb(t: BrowserTab, bmp: Bitmap) {
                  Thread {
                      try {
                          val sc = Bitmap.createScaledBitmap(bmp, 240, 240, true)
                          val ib = sc.asImageBitmap()
                          main.post { t.thumb = ib }
                          val f = thumbFile(t.id)
                          java.io.FileOutputStream(f).use { out ->
                              sc.compress(Bitmap.CompressFormat.JPEG, 75, out)
                          }
                          Backup.schedule()
                      } catch (e: Exception) {
                          Log.d("GreyScript", "thumb failed: " + e)
                      }
                  }.start()
              }

              private fun attach(t: BrowserTab, wv: WebView) {
                  wv.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest): WebResourceResponse? {
                          return Web.intercept(t, request)
                      }

                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          val sc = request.url.scheme ?: ""
                          if (sc == "http" || sc == "https" || sc == "about" || sc == "data" ||
                              sc == "blob" || sc == "file" || sc == "javascript"
                          ) return false
                          if (!request.isForMainFrame) return true
                          try {
                              val i = Intent.parseUri(request.url.toString(), Intent.URI_INTENT_SCHEME)
                              i.addCategory(Intent.CATEGORY_BROWSABLE)
                              i.component = null
                              i.selector = null
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              Web.appCtx.startActivity(i)
                          } catch (e: Exception) {
                              toast(Web.appCtx, "No app can open this link")
                          }
                          return true
                      }

                      override fun onPageStarted(view: WebView, url: String?, favicon: Bitmap?) {
                          val u = url ?: ""
                          t.failed = false
                          t.token = ""
                          t.loading = true
                          t.progress = 8
                          t.title = ""
                          val eu0 = t.errorUrl
                          if (eu0 != null && isErrorUri(u)) t.url = eu0 else t.url = u
                          t.pageUrl = t.url
                          t.thumb = null
                          t.videos.clear()
                          t.scrollY = 0
                          if (HideTool.active && HideTool.tabId == t.id) HideTool.deactivateLocal()
                          t.seen.clear()
                          t.mediaDirs.clear()
                          Web.resetProbe(t.id)
                          t.canGoBack = view.canGoBack()
                      }

                      override fun doUpdateVisitedHistory(view: WebView, url: String?, isReload: Boolean) {
                          val nu = url ?: ""
                          val eu = t.errorUrl
                          if (eu != null && isErrorUri(nu)) {
                              t.url = eu
                          } else {
                              t.errorUrl = null
                              t.url = nu
                          }
                          t.pageUrl = t.url
                          t.canGoBack = view.canGoBack()
                          dedupe(t)
                          Favicons.request(groupKeyOf(t))
                          persist()
                      }

                      override fun onPageFinished(view: WebView, url: String?) {
                          t.loading = false
                          t.progress = 0
                          t.canGoBack = view.canGoBack()
                          if (!t.failed && t.errorUrl == null && !isErrorUri(url ?: "")) HistoryStore.add(t.url, t.title)
                          main.postDelayed({ capture(t) }, 800)
                          persist()
                      }

                      override fun onReceivedError(view: WebView, request: WebResourceRequest, error: WebResourceError) {
                          if (!request.isForMainFrame) return
                          val failed = request.url.toString()
                          if (failed.isBlank() || isErrorUri(failed)) return
                          if (error.errorCode == WebViewClient.ERROR_UNKNOWN &&
                              error.description?.toString()?.contains("ERR_ABORTED") == true
                          ) return
                          t.failed = true
                          t.errorUrl = failed
                          view.loadUrl(errorPageUri(failed, error.errorCode))
                      }

                      override fun onReceivedSslError(view: WebView, handler: SslErrorHandler, error: SslError) {
                          handler.cancel()
                          val failed = error.url ?: ""
                          if (failed.isBlank() || isErrorUri(failed)) return
                          val cur = t.pageUrl
                          if (cur.isNotBlank() && normUrl(cur) != normUrl(failed)) return
                          t.failed = true
                          t.errorUrl = failed
                          view.loadUrl(errorPageUri(failed, WebViewClient.ERROR_FAILED_SSL_HANDSHAKE))
                      }

                      override fun onRenderProcessGone(view: WebView, detail: RenderProcessGoneDetail): Boolean {
                          recover(t, view)
                          return true
                      }
                  }
                  wv.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(view: WebView, newProgress: Int) {
                          if (newProgress >= 100) {
                              t.loading = false
                              t.progress = 0
                          } else {
                              t.loading = true
                              t.progress = maxOf(newProgress, 8)
                          }
                      }

                      override fun onReceivedTitle(view: WebView, title: String?) {
                          val tt = title ?: ""
                          if (tt.startsWith("data:")) return
                          t.title = tt
                          HistoryStore.setTitle(t.url, t.title)
                          persist()
                      }

                      override fun onShowCustomView(view: View, callback: WebChromeClient.CustomViewCallback) {
                          customView = view
                          customCb = callback
                          fullscreenTab = t.id
                          fullscreen = true
                      }

                      override fun onHideCustomView() {
                          customView = null
                          customCb = null
                          fullscreenTab = 0
                          fullscreen = false
                      }

                      override fun onJsAlert(view: WebView, url: String?, message: String?, result: JsResult): Boolean {
                          showJs(JsReq(0, message ?: "", "", { _ -> result.confirm() }, { result.confirm() }))
                          return true
                      }

                      override fun onJsConfirm(view: WebView, url: String?, message: String?, result: JsResult): Boolean {
                          showJs(JsReq(1, message ?: "", "", { _ -> result.confirm() }, { result.cancel() }))
                          return true
                      }

                      override fun onJsPrompt(
                          view: WebView, url: String?, message: String?, defaultValue: String?, result: JsPromptResult
                      ): Boolean {
                          showJs(JsReq(2, message ?: "", defaultValue ?: "", { s2 -> result.confirm(s2) }, { result.cancel() }))
                          return true
                      }

                      override fun onJsBeforeUnload(view: WebView, url: String?, message: String?, result: JsResult): Boolean {
                          showJs(JsReq(3, "", "", { _ -> result.confirm() }, { result.cancel() }))
                          return true
                      }

                      override fun onShowFileChooser(
                          webView: WebView,
                          filePathCallback: ValueCallback<Array<Uri>>,
                          fileChooserParams: WebChromeClient.FileChooserParams
                      ): Boolean {
                          return Web.chooseFile(filePathCallback, fileChooserParams)
                      }

                      override fun onPermissionRequest(request: PermissionRequest) {
                          request.deny()
                      }

                      override fun onGeolocationPermissionsShowPrompt(origin: String, callback: GeolocationPermissions.Callback) {
                          callback.invoke(origin, false, false)
                      }

                      override fun onCreateWindow(view: WebView, isDialog: Boolean, isUserGesture: Boolean, resultMsg: Message): Boolean {
                          if (!isUserGesture) return false
                          val tmp = WebView(view.context)
                          var done = false
                          tmp.webViewClient = object : WebViewClient() {
                              private fun take(u: String?) {
                                  if (done) return
                                  if (u.isNullOrBlank() || u == "about:blank") return
                                  done = true
                                  main.post {
                                      newTab(u, true, t.id)
                                      main.postDelayed({ Web.destroy(tmp) }, 300)
                                  }
                              }

                              override fun shouldOverrideUrlLoading(v: WebView, r: WebResourceRequest): Boolean {
                                  take(r.url.toString())
                                  return true
                              }

                              override fun onPageStarted(v: WebView, url: String?, favicon: Bitmap?) {
                                  take(url)
                              }
                          }
                          val tr = resultMsg.obj as WebView.WebViewTransport
                          tr.webView = tmp
                          resultMsg.sendToTarget()
                          return true
                      }
                  }
                  wv.setDownloadListener { url, ua, cd, mime, len ->
                      Downloads.fromUrl(url, ua, cd, mime, len, t.url)
                  }
                  wv.setOnScrollChangeListener { _, _, y, _, _ ->
                      t.scrollY = y
                  }
                  wv.setOnLongClickListener { v ->
                      val w = v as WebView
                      val r = w.hitTestResult
                      val ex = r.extra
                      var handled = false
                      when (r.type) {
                          WebView.HitTestResult.SRC_ANCHOR_TYPE -> {
                              if (!ex.isNullOrBlank()) {
                                  ctxMenu = CtxInfo(ex, false)
                                  handled = true
                              }
                          }
                          WebView.HitTestResult.IMAGE_TYPE -> {
                              if (!ex.isNullOrBlank()) {
                                  ctxMenu = CtxInfo(ex, true)
                                  handled = true
                              }
                          }
                          WebView.HitTestResult.SRC_IMAGE_ANCHOR_TYPE -> {
                              val h = Handler(Looper.getMainLooper()) { m ->
                                  val lk = m.data?.getString("url")
                                  val img = m.data?.getString("src")
                                  val target = if (!lk.isNullOrBlank()) lk else img
                                  if (!target.isNullOrBlank()) ctxMenu = CtxInfo(target, lk.isNullOrBlank())
                                  true
                              }
                              w.requestFocusNodeHref(h.obtainMessage())
                              handled = true
                          }
                      }
                      handled
                  }
              }
          }

          class PageEntry(val url: String, val title: String, val time: Long)

          private fun browserPrefs() =
              Web.appCtx.getSharedPreferences("browser", Context.MODE_PRIVATE)

          private fun readEntries(key: String): MutableList<PageEntry> {
              val out = mutableListOf<PageEntry>()
              try {
                  val arr = JSONArray(browserPrefs().getString(key, "[]") ?: "[]")
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      out.add(PageEntry(o.optString("u"), o.optString("t"), o.optLong("d")))
                  }
              } catch (e: Exception) {
              }
              return out
          }

          private fun writeEntries(key: String, list: List<PageEntry>) {
              val arr = JSONArray()
              for (e in list) {
                  val o = JSONObject()
                  o.put("u", e.url)
                  o.put("t", e.title)
                  o.put("d", e.time)
                  arr.put(o)
              }
              browserPrefs().edit().putString(key, arr.toString()).apply()
          }

          object HistoryStore {
              @Synchronized
              fun load(): List<PageEntry> = readEntries("history")

              @Synchronized
              fun add(url: String, title: String) {
                  if (url.isBlank() || url.startsWith("about:")) return
                  val l = readEntries("history")
                  if (l.isNotEmpty() && l[0].url == url) l.removeAt(0)
                  l.add(0, PageEntry(url, title, System.currentTimeMillis()))
                  while (l.size > 1000) l.removeAt(l.size - 1)
                  writeEntries("history", l)
              }

              @Synchronized
              fun setTitle(url: String, title: String) {
                  if (url.isBlank() || title.isBlank()) return
                  val l = readEntries("history")
                  val i = l.indexOfFirst { it.url == url }
                  if (i >= 0) {
                      l[i] = PageEntry(url, title, l[i].time)
                      writeEntries("history", l)
                  }
              }

              @Synchronized
              fun clear() {
                  writeEntries("history", emptyList())
              }
          }

          object BookmarkStore {
              var rev by mutableStateOf(0)
              val closing = mutableStateListOf<String>()
              private val jobs = HashMap<String, Runnable>()
              private val main = Handler(Looper.getMainLooper())

              fun requestRemove(url: String) {
                  if (closing.contains(url)) return
                  closing.add(url)
                  val r = Runnable {
                      jobs.remove(url)
                      closing.remove(url)
                      remove(url)
                  }
                  jobs[url] = r
                  main.postDelayed(r, 2000L)
              }

              fun undoRemove(url: String) {
                  val r = jobs.remove(url)
                  if (r != null) main.removeCallbacks(r)
                  closing.remove(url)
              }
              @Synchronized
              fun load(): List<PageEntry> = readEntries("bookmarks")

              @Synchronized
              fun add(url: String, title: String) {
                  if (url.isBlank()) return
                  val l = readEntries("bookmarks")
                  l.removeAll { it.url == url }
                  l.add(0, PageEntry(url, title, System.currentTimeMillis()))
                  writeEntries("bookmarks", l)
                  rev++
              }

              @Synchronized
              fun remove(url: String) {
                  val l = readEntries("bookmarks")
                  l.removeAll { it.url == url }
                  writeEntries("bookmarks", l)
                  rev++
              }
          }
