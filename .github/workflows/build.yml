          package com.grey.web

          import androidx.compose.animation.core.Animatable
          import androidx.compose.animation.core.CubicBezierEasing
          import androidx.compose.animation.core.LinearEasing
          import androidx.compose.animation.core.tween
          import androidx.compose.foundation.background
          import androidx.compose.foundation.gestures.detectTapGestures
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.runtime.SideEffect
          import androidx.compose.runtime.Stable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.key
          import androidx.compose.runtime.mutableStateListOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.rememberCoroutineScope
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.graphicsLayer
          import androidx.compose.ui.input.pointer.pointerInput
          import kotlinx.coroutines.launch

          sealed class ExitMode {
              object Back : ExitMode()
              object Fade : ExitMode()
          }

          object Motion {
              // 1 = browser fully shown; below 1 it is faded and slightly small (used when opening a tab / new tab)
              val browserIn = Animatable(1f)
              var exit: ExitMode = ExitMode.Back

              // bumped whenever the script list is saved so open screens reload it
              var storeVersion by mutableStateOf(0)
          }

          private val Decel = CubicBezierEasing(0.05f, 0.7f, 0.1f, 1f)
          private val Accel = CubicBezierEasing(0.3f, 0f, 0.8f, 0.15f)

          private fun depthOf(n: String): Int = when (n) {
              "editor", "guide", "filterguide" -> 2
              else -> 1
          }

          @Stable
          class OvLayer(val name: String) {
              val p = Animatable(0f)
              val ex = Animatable(0f)
              var exiting by mutableStateOf(false)
              var exit: ExitMode = ExitMode.Back
          }

          @Composable
          fun OverlayHost(
              screen: String,
              tabs: TabManager,
              content: @Composable (String) -> Unit
          ) {
              val layers = remember { mutableStateListOf<OvLayer>() }
              val scope = rememberCoroutineScope()
              SideEffect { tabs.browserVisible = layers.isEmpty() }
              LaunchedEffect(screen) {
                  val live = layers.filter { !it.exiting }
                  if (screen == "browser") {
                      val mode = Motion.exit
                      for (l in live) {
                          l.exit = mode
                          l.exiting = true
                      }
                  } else {
                      Motion.browserIn.snapTo(1f)
                      val idx = live.indexOfFirst { it.name == screen }
                      if (idx >= 0) {
                          for (i in idx + 1 until live.size) {
                              live[i].exit = ExitMode.Back
                              live[i].exiting = true
                          }
                      } else {
                          val d = depthOf(screen)
                          for (l in live) {
                              if (depthOf(l.name) >= d) {
                                  l.exit = ExitMode.Back
                                  l.exiting = true
                              }
                          }
                          layers.add(OvLayer(screen))
                      }
                  }
                  Motion.exit = ExitMode.Back
              }
              Box(Modifier.fillMaxSize()) {
                  for (l in layers) {
                      key(l) {
                          LayerView(
                              l,
                              layers,
                              { scope.launch { Motion.browserIn.animateTo(1f, tween(190, easing = Decel)) } }
                          ) { content(l.name) }
                      }
                  }
              }
          }

          @Composable
          private fun LayerView(
              l: OvLayer,
              layers: MutableList<OvLayer>,
              startBrowserIn: () -> Unit,
              body: @Composable () -> Unit
          ) {
              val fromLeft = l.name == "tabs"
              LaunchedEffect(l) {
                  if (!l.exiting) {
                      l.p.animateTo(1f, tween(240, easing = Decel))
                  }
              }
              LaunchedEffect(l.exiting) {
                  if (!l.exiting) return@LaunchedEffect
                  if (l.exit is ExitMode.Fade) {
                      Motion.browserIn.snapTo(0f)
                      l.ex.animateTo(1f, tween(100, easing = LinearEasing))
                      startBrowserIn()
                  } else {
                      l.p.animateTo(0f, tween(200, easing = Accel))
                  }
                  layers.remove(l)
              }
              Box(
                  Modifier
                      .fillMaxSize()
                      .pointerInput(Unit) { detectTapGestures { } }
              ) {
                  Box(
                      Modifier
                          .fillMaxSize()
                          .graphicsLayer {
                              if (l.exiting && l.exit is ExitMode.Fade) {
                                  alpha = 1f - l.ex.value
                              } else {
                                  val w = size.width
                                  translationX = if (fromLeft) -(1f - l.p.value) * w else (1f - l.p.value) * w
                              }
                          }
                          .background(BG)
                  ) {
                      body()
                  }
              }
          }
