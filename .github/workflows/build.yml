          import java.net.URL
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicInteger
          import java.util.concurrent.atomic.AtomicReference
          import javax.crypto.Cipher
          import javax.crypto.spec.IvParameterSpec
          import javax.crypto.spec.SecretKeySpec

          object FramePreview {
              private const val PART = 400 * 1024
              private const val BIG = 1500 * 1024
              private val FRACTIONS = doubleArrayOf(0.10, 0.30, 0.50, 0.70, 0.90)
              private val pool = Executors.newFixedThreadPool(3) { r ->
                  val t = Thread(r)
                  t.isDaemon = true
                  t
              }

              private fun open(url: String, h: Map<String, String>, range: String?): HttpURLConnection {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 12000
                  c.readTimeout = 15000
                  c.instanceFollowRedirects = true
                  c.setRequestProperty("User-Agent", h["User-Agent"] ?: DEFAULT_UA)
                  val ref = h["Referer"]
                  if (!ref.isNullOrBlank()) c.setRequestProperty("Referer", ref)
                  var origin = h["Origin"]
                  if (origin.isNullOrBlank() && !ref.isNullOrBlank()) origin = originOfUrl(ref)
                  if (!origin.isNullOrBlank()) c.setRequestProperty("Origin", origin)
                  var ck = h["Cookie"]
                  if (ck.isNullOrBlank()) {
                      ck = try {
                          android.webkit.CookieManager.getInstance().getCookie(url)
                      } catch (e: Exception) {
                          null
                      }
                  }
                  if (!ck.isNullOrBlank()) c.setRequestProperty("Cookie", ck)
                  if (range != null) c.setRequestProperty("Range", range)
                  return c
              }

              // Reads at most `limit` bytes from the start of a URL and then drops the connection.
              private fun readPart(url: String, h: Map<String, String>, limit: Int): ByteArray {
                  val c = open(url, h, "bytes=0-" + (limit - 1))
                  try {
                      val code = c.responseCode
                      if (code !in 200..299) throw Exception("HTTP " + code)
                      val out = ByteArrayOutputStream()
                      val buf = ByteArray(16384)
                      val ins = c.inputStream
                      while (out.size() < limit) {
                          val n = ins.read(buf, 0, minOf(buf.size, limit - out.size()))
                          if (n < 0) break
                          out.write(buf, 0, n)
                      }
                      return out.toByteArray()
                  } finally {
                      c.disconnect()
                  }
              }

              private fun hex(s0: String): ByteArray {
                  var s = s0.trim()
                  if (s.startsWith("0x") || s.startsWith("0X")) s = s.substring(2)
                  if (s.length % 2 == 1) s = "0" + s
                  val out = ByteArray(s.length / 2)
                  for (i in out.indices) out[i] = s.substring(i * 2, i * 2 + 2).toInt(16).toByte()
                  return if (out.size < 16) ByteArray(16 - out.size) + out else out
              }

              private fun ivFromSeq(seq: Long): ByteArray {
                  val b = ByteArray(16)
                  for (i in 0 until 8) b[15 - i] = ((seq shr (8 * i)) and 0xFFL).toByte()
                  return b
              }

              private fun isoDur(s: String): Double {
                  val m = Regex("^P(?:(\\d+)D)?(?:T(?:(\\d+)H)?(?:(\\d+)M)?(?:([\\d.]+)S)?)?\$").find(s) ?: return 0.0
                  val d = m.groupValues[1].toDoubleOrNull() ?: 0.0
                  val h = m.groupValues[2].toDoubleOrNull() ?: 0.0
                  val mi = m.groupValues[3].toDoubleOrNull() ?: 0.0
                  val sec = m.groupValues[4].toDoubleOrNull() ?: 0.0
                  return d * 86400.0 + h * 3600.0 + mi * 60.0 + sec
              }

              private fun post(a: DlAsk, g: Int, f: () -> Unit) {
                  Web.postMain { if (a.gen == g && !a.cancelled) f() }
              }

              private fun note(a: DlAsk, g: Int, s: String) {
                  post(a, g) { a.pNote = s }
              }

              // ---------------- inspect (small playlist/header requests only) ----------------

              fun inspect(a: DlAsk) {
                  val g = a.gen
                  Thread {
                      try {
                          val v = a.current
                          if (v != null && (v.kind == "AUDIO" || v.label.startsWith("Audio"))) {
                              note(a, g, "Audio only: no preview")
                          } else if (v != null && v.kind == "HLS") {
                              inspectHls(a, g, v)
                          } else if (v != null && v.kind == "DASH") {
                              inspectDash(a, g, v)
                          } else {
                              inspectFile(a, g)
                          }
                      } catch (e: Exception) {
                          Log.d("GreyScript", "inspect failed: " + e)
                          post(a, g) { if (a.pNote.isEmpty()) a.pNote = "Preview not available" }
                      }
                      post(a, g) { a.inspected = true }
                  }.start()
              }

              private fun inspectHls(a: DlAsk, g: Int, v: VideoItem) {
                  var low: VideoItem = v
                  var lowRank = Long.MAX_VALUE
                  for (o in a.options) {
                      if (o.kind != "HLS" || o.label.startsWith("Audio")) continue
                      if (o.rank >= 0L && o.rank < lowRank) {
                          lowRank = o.rank
                          low = o
                      }
                  }
                  val lines = fetchText(low.url, low.headers).lines().map { it.trim() }
                  var dur = 0.0
                  var ended = false
                  var enc = ""
                  var byteRange = false
                  var seq = 0L
                  var keyUrl: String? = null
                  var iv: ByteArray? = null
                  var initUrl: String? = null
                  val segs = ArrayList<HlsSeg>()
                  for (ln in lines) {
                      if (ln.startsWith("#EXT-X-MEDIA-SEQUENCE:")) {
                          seq = ln.substringAfter(':').trim().toLongOrNull() ?: 0L
                      } else if (ln.startsWith("#EXTINF:")) {
                          dur += ln.substringAfter(':').substringBefore(',').toDoubleOrNull() ?: 0.0
                      } else if (ln.startsWith("#EXT-X-ENDLIST")) {
                          ended = true
                      } else if (ln.startsWith("#EXT-X-KEY:")) {
                          val at = hlsAttrs(ln.substringAfter(':'))
                          val m = at["METHOD"] ?: "NONE"
                          if (m == "NONE") {
                              keyUrl = null
                              iv = null
                          } else if (m == "AES-128") {
                              keyUrl = resolveUrl(low.url, at["URI"] ?: "")
                              val ivs = at["IV"]
                              iv = if (ivs != null) hex(ivs) else null
                          } else {
                              enc = m
                          }
                      } else if (ln.startsWith("#EXT-X-MAP:")) {
                          val at = hlsAttrs(ln.substringAfter(':'))
                          if (at.containsKey("BYTERANGE")) byteRange = true
                          initUrl = resolveUrl(low.url, at["URI"] ?: "")
                      } else if (ln.startsWith("#EXT-X-BYTERANGE")) {
                          byteRange = true
                      } else if (ln.isNotEmpty() && !ln.startsWith("#")) {
                          segs.add(HlsSeg(resolveUrl(low.url, ln), keyUrl, iv, seq))
                          seq++
                      }
                  }
                  val msg = when {
                      !ended -> "Live stream: no preview"
                      enc.isNotEmpty() -> "Protected stream: no preview"
                      byteRange || segs.isEmpty() -> "Preview not available"
                      else -> ""
                  }
                  val ok = msg.isEmpty()
                  a.plan = SegPlan(initUrl, segs, "ts")
                  a.planHeaders = low.headers
                  val d2 = dur
                  val live = !ended
                  post(a, g) {
                      if (d2 > 0.0) a.duration = d2
                      a.live = live
                      a.canPreview = ok
                      a.pNote = msg
                  }
              }

              private fun inspectDash(a: DlAsk, g: Int, v: VideoItem) {
                  val xml = fetchText(v.url, v.headers)
                  val reps = parseMpd(v.url, xml)
                  var low: DashRep? = null
                  for (r in reps) {
                      if (r.kind != "video") continue
                      if (r.plan == null && r.single == null) continue
                      if (low == null || r.bw < low.bw) low = r
                  }
                  val ds = Regex("mediaPresentationDuration=\"([^\"]+)\"").find(xml)?.groupValues?.get(1)
                  val dur = if (ds != null) isoDur(ds) else 0.0
                  if (low == null) {
                      note(a, g, "Preview not available")
                      return
                  }
                  val single = low.single
                  val ok: Boolean
                  if (single != null) {
                      a.directUrl = single
                      a.planHeaders = v.headers
                      a.rangeOk = probeRange(single, v.headers)
                      ok = a.rangeOk
                  } else {
                      val p = low.plan
                      a.plan = p
                      a.planHeaders = v.headers
                      ok = p != null && p.segs.isNotEmpty()
                  }
                  post(a, g) {
                      if (dur > 0.0) a.duration = dur
                      a.canPreview = ok
                      if (!ok) a.pNote = "Preview not available"
                  }
              }

              private fun probeRange(url: String, h: Map<String, String>): Boolean {
                  val c = open(url, h, "bytes=0-0")
                  try {
                      return c.responseCode == 206
                  } finally {
                      c.disconnect()
                  }
              }

              private fun inspectFile(a: DlAsk, g: Int) {
                  val url = a.curUrl
                  val h = a.curHeaders
                  val c = open(url, h, "bytes=0-0")
                  try {
                      val code = c.responseCode
                      val ct = c.contentType ?: ""
                      val cd = c.getHeaderField("Content-Disposition")
                      var total = -1L
                      val cr = c.getHeaderField("Content-Range")
                      if (cr != null) {
                          val m = Regex("/(\\d+)\\s*\$").find(cr)
                          if (m != null) total = m.groupValues[1].toLong()
                      } else if (code == 200) {
                          total = c.contentLengthLong
                      }
                      val range = code == 206
                      val suggested = if (a.item.name.isBlank() && a.options.isEmpty()) Downloads.suggestName(cd, c.url.toString(), ct) else ""
                      val path = url.substringBefore('?').substringBefore('#').lowercase()
                      val vidExt = path.endsWith(".mp4") || path.endsWith(".m4v") || path.endsWith(".webm") ||
                          path.endsWith(".mkv") || path.endsWith(".mov") || path.endsWith(".3gp") || path.endsWith(".avi") ||
                          path.endsWith(".flv") || path.endsWith(".ogv")
                      val isVid = ct.startsWith("video/", true) || (vidExt && !ct.startsWith("text/", true))
                      a.rangeOk = range
                      a.directUrl = url
                      a.planHeaders = h
                      post(a, g) {
                          if (total > 0L && a.size <= 0L && a.options.isEmpty()) a.size = total
                          if (ct.isNotBlank()) a.mime = ct.substringBefore(';')
                          if (suggested.isNotBlank() && a.name.isBlank()) a.name = suggested
                          a.canPreview = isVid && range
                          if (isVid && !range) a.pNote = "Server does not allow partial download: no preview"
                      }
                  } finally {
                      c.disconnect()
                  }
              }

              // ---------------- frames (only when asked) ----------------

              fun retry(a: DlAsk) {
                  for (k in 0 until a.frames.size) a.frames[k] = null
                  a.pState = 0
                  a.pNote = ""
                  load(a)
              }

              fun load(a: DlAsk) {
                  if (a.pState == 1 || !a.canPreview) return
                  val g = a.gen
                  a.pState = 1
                  a.pNote = ""
                  val err = AtomicReference<String>("")
                  Thread {
                      var got = 0
                      try {
                          val p = a.plan
                          if (p != null) {
                              got = framesFromPlan(a, g, p, err)
                          } else if (a.directUrl.isNotBlank()) {
                              got = framesFromFile(a, g)
                          }
                      } catch (e: Exception) {
                          Log.d("GreyScript", "preview failed: " + e)
                          err.set(e.message ?: "")
                      }
                      val n = got
                      val er = err.get()
                      post(a, g) {
                          a.pState = if (n > 0) 2 else 3
                          if (n == 0) a.pNote = if (er.isNotBlank()) "Could not read frames (" + er + ")" else "Could not read frames"
                      }
                  }.start()
              }

              private fun scaleFrame(src: Bitmap): Bitmap {
                  val w = 480
                  val h = (src.height * w / src.width.coerceAtLeast(1)).coerceAtLeast(1)
                  val s = Bitmap.createScaledBitmap(src, w, h, true)
                  if (s !== src) src.recycle()
                  return s
              }

              private fun deliver(a: DlAsk, g: Int, slot: Int, bmp: Bitmap) {
                  val ib = bmp.asImageBitmap()
                  post(a, g) {
                      if (slot in 0 until a.frames.size) a.frames[slot] = ib
                  }
              }

              private fun grabFromPath(path: String): Bitmap? {
                  val m = MediaMetadataRetriever()
                  try {
                      m.setDataSource(path)
                      var bmp = m.getFrameAtTime(0L, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)
                      if (bmp == null) bmp = m.getFrameAtTime(-1L)
                      if (bmp == null) return null
                      return scaleFrame(bmp)
                  } catch (e: Exception) {
                      return null
                  } finally {
                      try {
                          m.release()
                      } catch (e: Exception) {
                      }
                  }
              }

              private fun trimTs(b: ByteArray): ByteArray {
                  if (b.size > 188 && b[0] == 0x47.toByte()) {
                      val n = b.size - b.size % 188
                      if (n < b.size) return b.copyOf(n)
                  }
                  return b
              }

              private fun segFrame(
                  a: DlAsk, plan: SegPlan, h: Map<String, String>, tmp: File, slot: Int, si: Int,
                  initF: ByteArray?, keys: HashMap<String, ByteArray>, err: AtomicReference<String>
              ): Bitmap? {
                  val seg = plan.segs[si]
                  for (limit in intArrayOf(PART, BIG)) {
                      var b = readPart(seg.url, h, limit)
                      val whole = b.size < limit
                      val ku = seg.keyUrl
                      if (ku != null) {
                          val key = synchronized(keys) { keys.getOrPut(ku) { readPart(ku, h, 64) } }
                          val iv = seg.iv ?: ivFromSeq(seg.seq)
                          val len = b.size - b.size % 16
                          val cipher = Cipher.getInstance("AES/CBC/NoPadding")
                          cipher.init(Cipher.DECRYPT_MODE, SecretKeySpec(key, "AES"), IvParameterSpec(iv))
                          b = cipher.doFinal(b, 0, len)
                      }
                      if (initF == null) b = trimTs(b)
                      val f = File(tmp, a.item.id + "_" + slot + "_" + si + "." + (if (initF != null) "mp4" else plan.ext))
                      try {
                          f.outputStream().use { o ->
                              if (initF != null) o.write(initF)
                              o.write(b)
                          }
                          val bmp = grabFromPath(f.absolutePath)
                          if (bmp != null) return bmp
                      } finally {
                          f.delete()
                      }
                      if (whole) break
                  }
                  err.set("no picture in segment")
                  return null
              }

              private fun framesFromPlan(a: DlAsk, g: Int, plan: SegPlan, err: AtomicReference<String>): Int {
                  val n = plan.segs.size
                  if (n == 0) return 0
                  val idxs = ArrayList<Int>()
                  for (f in FRACTIONS) {
                      var i = (n * f).toInt().coerceIn(0, n - 1)
                      while (idxs.contains(i) && i < n - 1) i++
                      if (!idxs.contains(i)) idxs.add(i)
                  }
                  val tmp = File(Web.appCtx.cacheDir, "prev")
                  tmp.mkdirs()
                  val h = a.planHeaders
                  var initBytes: ByteArray? = null
                  val ini = plan.init
                  if (ini != null) {
                      initBytes = try {
                          readPart(ini, h, 4000000)
                      } catch (e: Exception) {
                          err.set(e.message ?: "init")
                          null
                      }
                  }
                  val initF = initBytes
                  val keys = HashMap<String, ByteArray>()
                  val latch = CountDownLatch(idxs.size)
                  val count = AtomicInteger(0)
                  for ((slot, si) in idxs.withIndex()) {
                      pool.execute {
                          try {
                              val tries = ArrayList<Int>()
                              tries.add(si)
                              if (si + 1 < n) tries.add(si + 1)
                              if (si - 1 >= 0) tries.add(si - 1)
                              for (ci in tries) {
                                  if (a.gen != g || a.cancelled) break
                                  try {
                                      val bmp = segFrame(a, plan, h, tmp, slot, ci, initF, keys, err)
                                      if (bmp != null) {
                                          count.incrementAndGet()
                                          deliver(a, g, slot, bmp)
                                          break
                                      }
                                  } catch (e: Exception) {
                                      Log.d("GreyScript", "frame failed: " + e)
                                      err.set(e.message ?: "error")
                                  }
                              }
                          } finally {
                              latch.countDown()
                          }
                      }
                  }
                  latch.await(75, TimeUnit.SECONDS)
                  return count.get()
              }

              private fun framesFromFile(a: DlAsk, g: Int): Int {
                  val url = a.directUrl
                  val h = if (a.planHeaders.isNotEmpty()) a.planHeaders else a.curHeaders
                  val m = MediaMetadataRetriever()
                  var got = 0
                  try {
                      m.setDataSource(url, HashMap<String, String>(h))
                      val durMs = m.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)?.toLongOrNull() ?: 0L
                      if (durMs <= 0L) return 0
                      post(a, g) { if (a.duration <= 0.0) a.duration = durMs / 1000.0 }
                      for ((slot, f) in FRACTIONS.withIndex()) {
                          if (a.gen != g || a.cancelled) break
                          val t = (durMs * f * 1000.0).toLong()
                          val bmp = m.getFrameAtTime(t, MediaMetadataRetriever.OPTION_CLOSEST_SYNC) ?: continue
                          val sc = scaleFrame(bmp)
                          got++
                          deliver(a, g, slot, sc)
                      }
                  } catch (e: Exception) {
                      Log.d("GreyScript", "file preview failed: " + e)
                  } finally {
                      try {
                          m.release()
                      } catch (e: Exception) {
                      }
                  }
                  return got
              }
          }
