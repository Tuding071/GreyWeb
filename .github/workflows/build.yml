          package com.grey.web

          import org.w3c.dom.Element
          import org.xml.sax.InputSource
          import java.io.StringReader
          import javax.xml.parsers.DocumentBuilderFactory

          class DashRep(
              val id: String,
              val kind: String,
              val bw: Long,
              val w: Int,
              val h: Int,
              val codecs: String,
              val ext: String,
              val single: String?,
              val plan: SegPlan?
