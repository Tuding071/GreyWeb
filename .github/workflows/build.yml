name: Build GreyWeb

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Test keystore cache
        id: ks
        uses: actions/cache@v4
        with:
          path: keystore
          key: test-keystore-v1

      - name: Create test keystore
        if: steps.ks.outputs.cache-hit != 'true'
        run: |
          mkdir -p keystore
          keytool -genkeypair -keystore keystore/test.jks -storepass testkey123 \
            -keypass testkey123 -alias test -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Test, O=Test, C=PH"

      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/grey/web app/src/main/assets/ext app/src/main/res/xml app/src/main/res/drawable app/src/main/res/values app/src/main/res/values-v31 app/src/main/res/mipmap-anydpi-v26

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GreyWeb"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.0" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.grey.web"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.grey.web"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              signingConfigs {
                  create("test") {
                      storeFile = file(System.getenv("KEYSTORE_PATH"))
                      storePassword = "testkey123"
                      keyAlias = "test"
                      keyPassword = "testkey123"
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("test")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += "-Xskip-metadata-version-check"
              }
              buildFeatures { compose = true }
          }

          tasks.configureEach {
              if (name.startsWith("check") && name.endsWith("AarMetadata")) enabled = false
          }

          dependencies {
              implementation("androidx.webkit:webkit:1.14.0")
              implementation(platform("androidx.compose:compose-bom:2025.01.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.core:core-ktx:1.15.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <queries>
                  <package android:name="idm.internet.download.manager.plus" />
                  <package android:name="idm.internet.download.manager" />
                  <package android:name="idm.internet.download.manager.adm.lite" />
                  <package android:name="com.dv.adm.pay" />
                  <package android:name="com.dv.adm" />
              </queries>
              <application
                  android:label="GreyWeb"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="com.grey.web.fileprovider"
                  android:exported="false"
                  android:grantUriPermissions="true">
                  <meta-data
                      android:name="android.support.FILE_PROVIDER_PATHS"
                      android:resource="@xml/file_paths" />
              </provider>
              <service
                  android:name=".DownloadService"
                  android:exported="false"
                  android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <root-path name="root" path="." />
          </paths>
          EOF

