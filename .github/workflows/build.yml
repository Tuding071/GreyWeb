                  val ph = hostOf2(pageUrl)
                  val third = if (ph.isNotEmpty()) base(host) != base(ph) else false
                  val ctxHost = if (ph.isNotEmpty()) ph else host
                  val r = match(x.block, x.blockGen, url, third, type, ctxHost) ?: return false
                  if (!r.imp && match(x.allow, x.allowGen, url, third, type, ctxHost) != null) return false
                  return true
              }
