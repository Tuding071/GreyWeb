                                  if (t.startsWith("[")) {
                                      put = try { JSONArray(v) } catch (e: Exception) { v }
                                  } else if (t.startsWith("{")) {
                                      put = try { JSONObject(v) } catch (e: Exception) { v }
                                  }
                                  o.put(k, put)
                              }
                              is Boolean -> o.put(k, v)
                              is Int -> o.put(k, v)
                              is Long -> o.put(k, v)
                              is Float -> o.put(k, v.toDouble())
                          }
                      }
                      root.put(n, o)
                  }
                  return root
              }

              @Synchronized
              private fun writeNow(): Boolean {
                  if (!active) return false
                  return try {
                      val d = dir()
                      d.mkdirs()
                      val root = snapshot()
                      val f = mainFile()
                      val empty = root.optJSONObject("browser")?.length() == 0 &&
                          root.optJSONObject("scripts")?.length() == 0
                      if (empty && f.exists() && f.length() > 200L) {
                          false
                      } else {
                          val tmp = java.io.File(d, "greyweb.json.tmp")
                          tmp.writeText(root.toString(1))
                          JSONObject(tmp.readText())
                          var ok = tmp.renameTo(f)
                          if (!ok) {
                              try {
                                  tmp.copyTo(f, overwrite = true)
                                  tmp.delete()
                                  ok = true
                              } catch (e: Exception) {
                                  ok = false
                              }
                          }
                          if (ok) {
                              syncFilters(root)
                              syncThumbs(root)
                          }
                          ok
                      }
                  } catch (e: Exception) {
                      Log.e(TAG, "backup write failed", e)
                      false
                  }
              }

              private fun syncFilters(root: JSONObject) {
                  try {
                      val src = appFilters()
                      val dst = filtersDir()
                      val ids = HashSet<String>()
                      val arr = root.optJSONObject("browser")?.optJSONArray("filters")
                      if (arr != null) {
                          for (i in 0 until arr.length()) ids.add(arr.getJSONObject(i).optString("id"))
                      }
                      if (ids.isEmpty()) return
                      dst.mkdirs()
                      for (id in ids) {
                          val a = java.io.File(src, id + ".txt")
                          val b = java.io.File(dst, id + ".txt")
                          if (a.exists() && (!b.exists() || b.length() != a.length() || b.lastModified() < a.lastModified())) {
                              a.copyTo(b, overwrite = true)
                          }
                      }
                  } catch (e: Exception) {
                      Log.e(TAG, "filter sync failed", e)
                  }
              }

              private fun thumbsApp(): java.io.File = java.io.File(Web.appCtx.filesDir, "thumbs")

              private fun thumbsBk(): java.io.File = java.io.File(dir(), "thumbs")

              private fun syncThumbs(root: JSONObject) {
                  try {
                      val list = root.optJSONObject("browser")?.optJSONObject("tabs")?.optJSONArray("list") ?: return
                      val names = HashSet<String>()
                      for (i in 0 until list.length()) names.add("t" + list.getJSONObject(i).optInt("id") + ".jpg")
                      val src = thumbsApp()
                      val dst = thumbsBk()
                      dst.mkdirs()
                      for (n in names) {
                          val a = java.io.File(src, n)
                          val b = java.io.File(dst, n)
                          if (a.exists() && (!b.exists() || b.length() != a.length() || b.lastModified() < a.lastModified())) {
                              a.copyTo(b, overwrite = true)
                          }
                      }
                      val old = dst.listFiles() ?: return
                      for (f in old) {
                          if (f.name.endsWith(".jpg") && !names.contains(f.name)) f.delete()
                      }
                  } catch (e: Exception) {
                      Log.e(TAG, "thumb sync failed", e)
                  }
              }

              private fun restoreThumbFiles() {
                  try {
                      val files = thumbsBk().listFiles() ?: return
                      val dst = thumbsApp()
                      dst.mkdirs()
                      for (f in files) {
                          if (!f.name.endsWith(".jpg")) continue
                          val t = java.io.File(dst, f.name)
                          if (!t.exists() || t.length() != f.length()) f.copyTo(t, overwrite = true)
                      }
                  } catch (e: Exception) {
                      Log.e(TAG, "thumb restore failed", e)
                  }
              }

              private fun restoreFilterFiles() {
                  try {
                      val files = filtersDir().listFiles() ?: return
                      val dst = appFilters()
                      dst.mkdirs()
                      for (f in files) {
                          if (!f.name.endsWith(".txt")) continue
                          val t = java.io.File(dst, f.name)
                          if (!t.exists() || t.length() != f.length()) f.copyTo(t, overwrite = true)
                      }
                  } catch (e: Exception) {
                      Log.e(TAG, "filter restore failed", e)
                  }
              }

              fun schedule() {
                  if (!active) return
                  main.removeCallbacks(job)
                  main.postDelayed(job, 600L)
              }

              fun flush() {
                  if (!active) return
                  main.removeCallbacks(job)
                  writeNow()
              }

              fun finish() {
                  if (!active) return
                  main.removeCallbacks(job)
                  val ok = writeNow()
                  active = false
                  for (n in names) prefs(n).unregisterOnSharedPreferenceChangeListener(listener)
                  if (ok) {
                      for (n in names) prefs(n).edit().clear().commit()
                  }
                  Log.d(TAG, "backup finished, cleared=" + ok)
              }
          }
