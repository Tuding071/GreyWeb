          @Composable
          fun StartupWarmup(tabs: TabManager) {
              var stage by remember { mutableStateOf(0) }
              val fade = remember { Animatable(1f) }
              LaunchedEffect(Unit) {
                  withFrameNanos { }
                  stage = 1
                  repeat(3) { withFrameNanos { } }
                  stage = 2
                  fade.animateTo(0f, tween(200))
                  stage = 3
              }
              if (stage < 3) {
                  Box(
                      Modifier
                          .fillMaxSize()
                          .graphicsLayer { alpha = fade.value }
                          .background(BG)
                          .pointerInput(Unit) { detectTapGestures { } }
                  ) {
                      if (stage == 1) {
                          Box(Modifier.fillMaxSize()) { TabManagerScreen(tabs, { }, { }, { _ -> }) }
                          Box(Modifier.fillMaxSize()) { HistoryScreen({ }, { _ -> }) }
                          Box(Modifier.fillMaxSize()) { BookmarksScreen(tabs, { }, { _ -> }) }
                          Box(Modifier.fillMaxSize()) { DownloadsScreen({ }) }
                          Box(Modifier.fillMaxSize()) { ScriptsScreen({ }, { _ -> }, { }) }
                          Box(Modifier.fillMaxSize()) { FiltersScreen({ }, { }) }
                          Box(Modifier.fillMaxSize()) { ElementRulesScreen({ }) }
                          Box(Modifier.fillMaxSize()) { GuideScreen({ }) }
                          Box(Modifier.fillMaxSize()) { FilterGuideScreen({ }) }
                      }
                      Box(
