          @Composable
          fun ScriptsScreen(onBack: () -> Unit, onEdit: (String?) -> Unit, onGuide: () -> Unit) {
              val scope = rememberCoroutineScope()
              var scripts by remember(Motion.storeVersion) { mutableStateOf(Store.load()) }
              var status by remember { mutableStateOf("") }
              var busy by remember { mutableStateOf(false) }
              var showImport by remember { mutableStateOf(false) }
              fun reload() { scripts = Store.load() }
              val updates = scripts.count { it.remoteVersion.isNotBlank() }

              Column(Modifier.fillMaxSize()) {
                  Header {
                      TextButton(onClick = onBack) { Text("←", color = Color.White, fontSize = 20.sp) }
                      Text("Scripts", color = Color.White, fontSize = 18.sp)
                      Spacer(Modifier.width(8.dp))
                      Box(
                          Modifier
                              .size(26.dp)
                              .border(1.dp, Color(0xFF888888), CircleShape)
                              .clickable { onGuide() },
                          contentAlignment = Alignment.Center
                      ) {
                          Text("?", color = Color.White, fontSize = 14.sp)
                      }
                      Spacer(Modifier.weight(1f))
                      TextButton(onClick = { showImport = true }) { Text("Import", color = Color.White) }
                      TextButton(onClick = { onEdit(null) }) { Text("New", color = Color.White) }
                  }
                  Row(
                      Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 2.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text(
                          scripts.size.toString() + " scripts · " + scripts.count { it.enabled } + " enabled",
                          color = Soft,
                          fontSize = 12.sp,
                          modifier = Modifier.weight(1f)
                      )
                      TextButton(onClick = {
                          if (!busy) {
                              busy = true
                              status = "Checking…"
                              scope.launch {
                                  val n = withContext(Dispatchers.IO) { Updater.checkAll() }
                                  reload()
                                  busy = false
                                  status = if (n == 0) "All scripts are up to date" else n.toString() + " update(s) available"
                              }
                          }
                      }) { Text("Check updates", color = Color.White, fontSize = 12.sp) }
                      if (updates > 0) {
                          TextButton(onClick = {
                              if (!busy) {
                                  busy = true
                                  status = "Updating…"
                                  scope.launch {
                                      val n = withContext(Dispatchers.IO) { Updater.applyAll() }
                                      reload()
                                      busy = false
                                      status = n.toString() + " script(s) updated"
                                  }
                              }
                          }) { Text("Update all", color = Color.White, fontSize = 12.sp) }
                      }
                  }
                  if (status.isNotBlank()) {
                      Text(status, color = Soft, fontSize = 12.sp, modifier = Modifier.padding(horizontal = 12.dp, vertical = 2.dp))
                  }
                  if (scripts.isEmpty()) {
                      Text(
                          "No scripts yet. Tap New to start from a template, or tap ? for a guide you can give to an AI.",
                          color = Soft,
                          fontSize = 13.sp,
                          modifier = Modifier.padding(12.dp)
                      )
                  }
                  LazyColumn(Modifier.weight(1f)) {
                      items(scripts, key = { it.id }) { s ->
                          ScriptRow(
                              s,
                              onClick = { onEdit(s.id) },
                              onToggle = { v -> Store.setEnabled(s.id, v); reload() }
                          )
                      }
                  }
              }
              if (showImport) {
                  ImportDialog(
                      onDismiss = { showImport = false },
                      onImported = { name ->
                          showImport = false
                          reload()
                          status = "Imported " + name
                      }
                  )
              }
          }

